description = "Graph, kernel and empirical analysis of UNet-family semantic segmentation architectures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy>=2.4.2",
    "tqdm>=4.67.3",
    "matplotlib>=3.10.8",
    "pillow>=12.1.1",
    "scipy>=1.17.1",
    "graphviz>=0.21",
]
